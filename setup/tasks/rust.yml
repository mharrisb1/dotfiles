---
- name: Install rustup
  become: false
  shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
  args:
    creates: "{{ user_home }}/.cargo/bin/rustup"

- name: Install Cargo tools
  become: false
  shell: |
    set -e
    test -x "{{ user_home }}/.cargo/bin/{{ item }}" || \
      "{{ user_home }}/.cargo/bin/cargo" install --locked {{ item }}
  loop:
    - zellij
    - git-delta
    - protols
    - csvlens
    - neocmakelsp
    - kdlfmt
    - dua-cli

- name: Install codebook-lsp
  shell: "{{ user_home }}/.cargo/bin/cargo install --git https://github.com/blopker/codebook codebook-lsp"
  args:
    creates: "{{ user_home }}/.cargo/bin/codebook-lsp"
