---
- name: Download Go tarball
  get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
    mode: "0644"

- name: Remove existing Go installation
  become: true
  file:
    path: /usr/local/go
    state: absent
  when: not ansible_check_mode

- name: Extract Go to /usr/local
  become: true
  unarchive:
    src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: true
    creates: "/usr/local/go/bin/go"

- name: Install Go tools
  command:
    cmd: "/usr/local/go/bin/go install {{ item.package }}@latest"
    creates: "{{ user_home }}/go/bin/{{ item.bin }}"
  loop:
    - { package: "golang.org/x/tools/gopls", bin: "gopls" }
    - { package: "github.com/go-delve/delve/cmd/dlv", bin: "dlv" }
    - { package: "golang.org/x/tools/cmd/goimports", bin: "goimports" }
    - {
        package: "github.com/nametake/golangci-lint-langserver",
        bin: "golangci-lint-langserver",
      }
    - {
        package: "github.com/golangci/golangci-lint/v2/cmd/golangci-lint",
        bin: "golangci-lint",
      }
    - { package: "github.com/jesseduffield/lazygit", bin: "lazygit" }
    - { package: "github.com/jesseduffield/lazydocker", bin: "lazydocker" }
    - { package: "github.com/charmbracelet/glow/v2", bin: "glow" }
    - { package: "github.com/quantonganh/jdtls-wrapper", bin: "jdtls-wrapper" }
    - {
        package: "github.com/docker/docker-language-server/cmd/docker-language-server",
        bin: "docker-language-server",
      }
    - { package: "github.com/reteps/dockerfmt", bin: "dockerfmt" }
    - { package: "github.com/mharrisb1/markings", bin: "markings" }
  loop_control:
    label: "{{ item.bin }}"
