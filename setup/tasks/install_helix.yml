---
- name: Clone Helix
  become: false
  git:
    repo: https://github.com/helix-editor/helix
    dest: "{{ user.home }}/helix"
    depth: 1
    update: false

- name: Install Helix
  become: false
  shell: "{{ user.home }}/.cargo/bin/cargo install --profile opt --path helix-term --locked"
  args:
    chdir: "{{ user.home }}/helix"
    creates: "{{ user.home }}/.cargo/bin/hx"
