---
user:
  name: "Michael Harris"
  email: "michael.harrisru@gmail.com"
  home: "{{ lookup('env', 'HOME') }}"
  editor: "hx"

paths:
  dotfiles: "{{ playbook_dir | dirname }}"
  nvm: "{{ user.home }}/.nvm"
  xdg_config_home: "{{ user.home }}/.config"

software:
  - name: "common_utils"
    enable: true
    apt:
      ca-certificates: true
      curl: true
      gnupg: true
      lsb-release: true
      software-properties-common: true
      sudo: true

  - name: "c/cpp"
    enable: true
    apt:
      build-essential: true
      clangd: true
      cmake: true
      gdb: true
      ninja-build: false
    uv_tool:
      - name: "cmake-language-server==0.1.11"
        enable: true
    cargo:
      - name: neocmakelsp
        enable: true

  - name: "docker"
    enable: false
    task_file: "tasks/install_docker.yml"
    go_mod:
      - name: lazydocker
        enable: true
        mod: "github.com/jesseduffield/lazydocker"
      - name: docker-language-server
        enable: true
        mod: "github.com/docker/docker-language-server/cmd/docker-language-server"
      - name: dockerfmt
        enable: true
        mod: "github.com/reteps/dockerfmt"

  - name: "git"
    enable: true
    task_file: "tasks/configure_git.yml"
    apt:
      git: true

  - name: "go"
    enable: true
    config:
      version: "1.23.4"
    task_file: "tasks/install_go.yml"
    go_mod:
      - name: gopls
        enable: true
        mod: "golang.org/x/tools/gopls"
      - name: dlv
        enable: true
        mod: "github.com/go-delve/delve/cmd/dlv"
      - name: goimports
        enable: true
        mod: "golang.org/x/tools/cmd/goimports"
      - name: golangci-lint-langserver
        enable: true
        mod: "github.com/nametake/golangci-lint-langserver"
      - name: golangci-lint
        enable: true
        mod: "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"

  - name: "helix"
    enable: true
    task_file: "tasks/install_helix.yml"

  - name: "java"
    enable: false
    config:
      lombok_version: "1.18.34"
      maven_version: "3.9.9"
    task_file: "tasks/install_java.yml"
    go_mod:
      - name: jdtls-wrapper
        enable: true
        mod: "github.com/quantonganh/jdtls-wrapper"

  - name: "lazygit"
    enable: true
    cargo:
      - name: git-delta
        enable: true
    go_mod:
      - name: lazygit
        enable: true
        mod: "github.com/jesseduffield/lazygit"

  - name: "markdown"
    enable: true
    task_file: "tasks/install_marksman.yml"
    cargo:
      - name: codebook-lsp
        enable: true
        git: "https://github.com/blopker/codebook"
    go_mod:
      - name: glow
        enable: false
        mod: "github.com/charmbracelet/glow/v2"

  - name: "misc_tools"
    enable: true
    apt:
      bat: true
      bc: true
      fastfetch: "{{ ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int >= 25 }}"
      fzf: true
      htop: true
      neofetch: "{{ ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] | int <= 24 }}"
      psmisc: true
    cargo:
      - name: csvlens
        enable: false
      - name: dua-cli
        enable: true

  - name: "node"
    enable: true
    config:
      version: "26.5.0"
    task_file: "tasks/install_node.yml"

  - name: "perf_tools"
    enable: true
    task_file: "tasks/enable_perf_counters.yml"
    apt:
      bpftrace: true
      linux-tools-generic: true
      valgrind: true

  - name: "protobuf"
    enable: true
    cargo:
      - name: protols
        enable: true

  - name: "python"
    enable: true
    task_file: "tasks/install_uv.yml"
    apt:
      build-essential: true
      libssl-dev: true
      pkg-config: true
      python3-dev: true
      python3-pip: true
      python3-venv: true
    uv_tool:
      - name: "basedpyright==1.39.0"
        enable: true
      - name: "ruff@0.15.9"
        enable: true

  - name: "rust"
    enable: true
    task_file: "tasks/install_rust.yml"

  - name: "xplr"
    enable: true
    task_file: "tasks/install_xplr.yml"

  - name: "yaml"
    enable: true
    uv_tool:
      - name: "ansible-lint==26.4.0"
        enable: true

  - name: "zellij"
    enable: true
    cargo:
      - name: zellij
        enable: true
      - name: kdlfmt
        enable: true

  - name: "zsh"
    enable: true
    task_file: "tasks/setup_oh_my_zsh.yml"
    apt:
      zsh: true
